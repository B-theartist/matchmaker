# Declarative Automation Bundle: everything Databricks should contain for Matchmaker.
# (app.yaml = how to START the program; this file = what to DEPLOY in the workspace.)
#
#   (cd frontend && npm run build)              # build the React app first
#   databricks bundle validate -p koantek-free  # is this file correct?
#   databricks bundle plan     -p koantek-free  # preview changes (look for 0 to delete)
#   databricks bundle deploy   -p koantek-free  # make the workspace match this file
#   databricks bundle run matchmaker -p koantek-free   # start the app with the new code

bundle:
  name: matchmaker

# Upload rules. Files in .gitignore are skipped by default; the built React app is
# git-ignored (it's generated), so we explicitly include it.
sync:
  include:
    - frontend/dist/**
  exclude:
    - frontend/node_modules/**
    - scripts/**

resources:
  # ---------- Lakebase (serverless Postgres) ----------
  # Created first in the dashboard, then BOUND to this bundle so the bundle manages it.
  # prevent_destroy: `bundle destroy` refuses to delete the database that holds our data.
  postgres_projects:
    matchmaker_db:
      project_id: matchmaker
      display_name: matchmaker
      pg_version: 18
      lifecycle:
        prevent_destroy: true

  postgres_branches:
    production:
      parent: projects/matchmaker
      branch_id: production
      no_expiry: true
      lifecycle:
        prevent_destroy: true
        depends_on:
          - resource: postgres_projects.matchmaker_db

  postgres_databases:
    app_db:
      parent: projects/matchmaker/branches/production
      database_id: databricks-postgres          # Databricks' resource ID (hyphen)
      postgres_database: databricks_postgres    # the name inside Postgres (underscore)
      role: projects/matchmaker/branches/production/roles/braedencasados
      lifecycle:
        prevent_destroy: true
        depends_on:
          - resource: postgres_branches.production

  # ---------- The app ----------
  apps:
    matchmaker:
      name: matchmaker
      description: "Skill & Knowledge Matchmaker - find peers across client engagements"
      source_code_path: .
      resources:
        # Lets the app's service principal log in to the database above.
        - name: database
          postgres:
            branch: projects/matchmaker/branches/production
            database: projects/matchmaker/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      lifecycle:
        depends_on:
          - resource: postgres_databases.app_db

targets:
  dev:
    default: true
    workspace:
      # Pinned to the Free Edition workspace so we can never deploy to the wrong one.
      host: https://dbc-f84e7376-c50f.cloud.databricks.com
